<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="-11.5 -2 80 80">
  <!-- The docx4j mark (docx4java.org/logo-75.png, 57 x 75), redrawn as a vector in its own coordinates. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7f7f7"/>
      <stop offset="1" stop-color="#ebebeb"/>
    </linearGradient>
    <linearGradient id="flap" x1="41" y1="5" x2="54" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8f8f8"/>
      <stop offset="0.55" stop-color="#d6d6d6"/>
      <stop offset="1" stop-color="#9e9e9e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.7"/>
      <feOffset dx="0.5" dy="0.8" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="cut1" d="M0.5,19 C6,18.8 12,17.2 18,17.2 L23.5,17.2 C25,17.2 25,18.8 24.4,20.2 C23.6,22 22.8,24 23.6,25.4 C24.6,27 32.4,27 33.4,25.4 C34.2,24 33.4,22 32.6,20.2 C32,18.8 32,17.2 33.5,17.2 L39,17.2 C45,17.2 51,18.8 56.5,19"/>
    <path id="cut2" d="M0.5,42 C6,42 12,43.3 18,43.3 L23.8,43.3 C25.3,43.3 25.3,41.6 24.4,40.2 C23.4,38.6 22.6,36.6 23.6,35.4 C24.6,34 32.4,34 33.4,35.4 C34.4,36.6 33.6,38.6 32.6,40.2 C31.7,41.6 31.7,43.3 33.2,43.3 L39,43.3 C45,43.3 51,42 56.5,42"/>
    <path id="cut3" d="M0.5,58.6 C6,58.5 12,57.1 18,57.1 L23.5,57.1 C25,57.1 25,58.8 24.3,60.3 C23.5,62 22.8,63.8 23.6,65.2 C24.6,66.9 32.4,66.9 33.4,65.2 C34.2,63.8 33.5,62 32.7,60.3 C32,58.8 32,57.1 33.5,57.1 L39,57.1 C45,57.1 51,58.5 56.5,58.6"/>
  </defs>
  <g filter="url(#shadow)">
    <path d="M0.5,0.5 H39 L56.5,13.5 V74.5 H0.5 Z" fill="url(#paper)" stroke="#a2a2a2" stroke-width="1" stroke-linejoin="round"/>
    <path d="M39,0.5 L56.5,13.5 L56.5,15.2 L45.6,15.2 C42.6,11.6 40.2,6.2 39,0.5 Z" fill="url(#flap)" stroke="#8a8a8a" stroke-width="0.8" stroke-linejoin="round"/>
  </g>
  <!-- Each cut has a soft grey shadow just below it, as the original has. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#bdbdbd" stroke-width="1" transform="translate(0 0.75)">
      <use href="#cut1"/>
      <use href="#cut2"/>
      <use href="#cut3"/>
    </g>
    <g stroke="#565656" stroke-width="1">
      <use href="#cut1"/>
      <use href="#cut2"/>
      <use href="#cut3"/>
    </g>
  </g>
</svg>
